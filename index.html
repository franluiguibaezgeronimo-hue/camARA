<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123c32">
    <title>Un regalo para ti</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #fff8e9;
        background: #123c32;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 110%, rgba(201, 49, 55, 0.35), transparent 55%),
          radial-gradient(ellipse at 50% 0%, rgba(247, 210, 128, 0.13), transparent 48%),
          #123c32;
      }

      .card {
        width: min(100%, 520px);
        text-align: center;
      }

      .greeting {
        margin: 0 0 10px;
        color: #f3d48e;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(36px, 8vw, 58px);
        font-weight: 500;
      }

      .instruction {
        margin: 14px 0 30px;
        color: #d7e3d6;
        font-size: 16px;
      }

      .gift-button {
        position: relative;
        display: grid;
        width: 220px;
        height: 220px;
        margin: 0 auto;
        padding: 0;
        place-items: center;
        border: 0;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .gift-button:focus-visible {
        outline: 3px solid #f3d48e;
        outline-offset: 10px;
        border-radius: 12px;
      }

      .gift {
        position: relative;
        display: block;
        width: 150px;
        height: 125px;
        margin-top: 30px;
        border: 3px solid #f3d48e;
        border-radius: 8px;
        background: #c9343d;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.23);
        transition: transform 450ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .gift::before,
      .gift::after {
        position: absolute;
        display: block;
        content: "";
        background: #f3d48e;
      }

      .gift::before {
        top: 0;
        bottom: 0;
        left: 58px;
        width: 26px;
      }

      .gift::after {
        top: -25px;
        left: -9px;
        width: 162px;
        height: 29px;
        border: 3px solid #f3d48e;
        border-radius: 6px;
        background: #d8464c;
      }

      .bow {
        position: absolute;
        z-index: 1;
        top: -58px;
        left: 51px;
        width: 48px;
        height: 37px;
        border: 8px solid #f3d48e;
        border-radius: 50% 50% 12% 50%;
        transform: rotate(20deg);
      }

      .bow::after {
        position: absolute;
        top: -8px;
        left: 25px;
        width: 48px;
        height: 37px;
        border: 8px solid #f3d48e;
        border-radius: 50% 50% 50% 12%;
        content: "";
        transform: rotate(-40deg);
      }

      .gift-button:hover .gift,
      .gift-button:focus-visible .gift {
        transform: translateY(-8px) rotate(-3deg);
      }

      .gift-button[aria-expanded="true"] .gift {
        transform: translateY(28px) scale(0.86);
      }

      .gift-button[aria-expanded="true"] .bow {
        transform: translate(-18px, -38px) rotate(-28deg);
      }

      .message {
        min-height: 86px;
        margin: 18px 0 0;
        color: #f3d48e;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(23px, 5vw, 32px);
        line-height: 1.35;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 350ms ease, transform 350ms ease;
      }

      .message.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .bird-scene {
        position: relative;
        height: 74px;
        margin: 4px auto 0;
        opacity: 0;
        transition: opacity 350ms ease;
      }

      .bird-scene.is-visible {
        opacity: 1;
      }

      .bird {
        position: absolute;
        top: 8px;
        font-size: 34px;
        animation: peck 700ms ease-in-out infinite alternate;
      }

      .bird-left {
        left: calc(50% - 76px);
        animation-delay: 120ms;
      }

      .bird-right {
        right: calc(50% - 76px);
        transform: scaleX(-1);
        animation-delay: 420ms;
      }

      .crumbs {
        position: absolute;
        top: 43px;
        left: 50%;
        color: #f3d48e;
        font-size: 17px;
        letter-spacing: 3px;
        transform: translateX(-50%);
      }

      @keyframes peck {
        from {
          translate: 0 0;
        }

        to {
          translate: 0 7px;
        }
      }

      .hint {
        margin: 0;
        color: #d7e3d6;
        font-size: 14px;
      }

      .hint[hidden] {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="greeting">Un detalle para ti</p>
      <h1>¡Feliz Navidad!</h1>
      <p class="instruction">Tienes un regalo. ¿Te animas a abrirlo?</p>
      <button
        id="giftButton"
        class="gift-button"
        type="button"
        aria-label="Abrir regalo de Navidad"
        aria-expanded="false"
        aria-controls="giftMessage"
      >
        <span class="gift" aria-hidden="true"><span class="bow"></span></span>
      </button>
      <p id="giftMessage" class="message" role="status" aria-live="polite"></p>
      <div id="birdScene" class="bird-scene" aria-hidden="true">
        <span class="bird bird-left">🐦</span>
        <span class="bird bird-right">🐦</span>
        <span class="crumbs">· · · · ·</span>
      </div>
      <p id="hint" class="hint">Haz clic en el regalo</p>
    </main>
    <script>
      const giftButton = document.querySelector("#giftButton");
      const giftMessage = document.querySelector("#giftMessage");
      const birdScene = document.querySelector("#birdScene");
      const hint = document.querySelector("#hint");

      giftButton.addEventListener("click", () => {
        giftButton.setAttribute("aria-expanded", "true");
        giftMessage.textContent =
          "¡Felicidades, eres un cachudo! 🎄 Y también migajer@… especialmente pa Nicole.";
        giftMessage.classList.add("is-visible");
        birdScene.classList.add("is-visible");
        hint.hidden = true;
      });
    </script>
  </body>
</html>
